[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lss-sync"
version = "0.1.0"
description = "Encrypted offline outbox and bounded adaptive synchronization"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Safi Ullah Mirzai"}]
dependencies = ["cryptography>=46,<52"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Database",
]

[tool.setuptools.packages.find]
where = ["src"]
